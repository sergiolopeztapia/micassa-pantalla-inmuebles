name: Build and upload docker image

on:
  push:
    branches:
      - main

# 1. Definimos los permisos necesarios para escribir en el registro del paquete
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Inicia sesión en GitHub Container Registry usando el token automático
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ACTUALIZADO: Añadimos la clave "platforms"
      - name: Construir y subir imagen a GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64 # <--- Esto es lo que soluciona el error
          tags: |
            ghcr.io/${{ github.repository_owner }}/micassa:latest
